{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "multica.fullname" . }}-backend
  labels:
    {{- include "multica.labels" . | nindent 4 }}
    {{- toYaml .Values.monitoring.serviceMonitor.additionalLabels | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  endpoints:
    - port: metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      path: /metrics
---
{{- end }}
{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "multica.fullname" . }}
  labels:
    {{- include "multica.labels" . | nindent 4 }}
    {{- toYaml .Values.monitoring.prometheusRule.additionalLabels | nindent 4 }}
spec:
  groups:
    - name: multica.availability
      rules:
        - alert: MulticaBackendUnavailable
          expr: kube_deployment_status_replicas_available{deployment="{{ include "multica.fullname" . }}-backend"} < 1
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: Multica backend has no available replica
        - alert: MulticaRealtimeRedisDisconnected
          expr: max(multica_realtime_redis_connected) < 1
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: Multica realtime relay is disconnected from Redis
{{- end }}
